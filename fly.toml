# Fly.io deployment manifest for the Vantage backend (api, worker, beat).
#
# Region note (plan 14-08): every Fly volume created for this app or for the
# sibling `vantage-chroma` / `vantage-redis` apps MUST be created in this same
# primary_region. A machine that reschedules into a different region than its
# volume comes up with no volume attached.
app            = "vantage"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # DEPLOY-03: Fly runs this once per deploy in a temporary machine built from
  # the freshly-built image, after the build completes and before any api,
  # worker, or beat machine is created or updated. A non-zero exit aborts the
  # release, so a broken migration never reaches a running machine.
  #
  # Bare command, no virtualenv path prefix: the Dockerfile installs packages
  # globally (`pip install --no-cache-dir -r requirements/base.txt`), so
  # `alembic` already resolves on PATH inside the image.
  #
  # Migrations must NEVER be run from a container start command (CMD/process
  # entrypoint) instead of here — that would re-run on every machine restart
  # and race across the three process groups, which is exactly what
  # release_command exists to prevent.
  release_command = "alembic upgrade head"
  # release_command_timeout left at its 5-minute default. Plan 14-09 should
  # raise it only if a cold Neon compute wake-up plus the migration run
  # measured in practice exceeds 5 minutes.

[env]
  # Non-secret private-network coordinates only. `vantage-chroma` is the
  # sibling Fly app created by plan 14-04; `.flycast` addresses are reachable
  # only over Fly's private network.
  CHROMADB_HOST = "vantage-chroma.flycast"
  CHROMADB_PORT = "8000"
  # The following secret VALUES are never written here — set via
  # `fly secrets set` (plan 14-08) and injected as env vars at runtime:
  #   DATABASE_URL, REDIS_URL, JWT_SECRET_KEY, GROQ_API_KEY, NEWS_API_KEY,
  #   FRED_API_KEY, ALLOWED_ORIGINS

[processes]
  api    = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "celery -A app.workers.celery_app:celery_app worker --loglevel=info"
  # Celery beat is the scheduler process (enqueues evaluate_alert_rules on its
  # 15-minute tick, per WATCH-09/D-04) — the worker above is the executor.
  # Exactly one beat replica may ever run: two schedulers would double every
  # tick, doubling external API load and racing on the scheduled rules'
  # last-triggered timestamp. Workers may still be scaled horizontally; the
  # scheduler may not. The count is pinned by `fly scale count beat=1` in
  # plan 14-09 — the absence of a service block below (beat has none) is what
  # makes it structurally unstoppable by the Fly proxy in the first place.
  beat   = "celery -A app.workers.celery_app:celery_app beat --loglevel=info"

# --- api is the ONLY process group behind the Fly proxy --------------------
# worker and beat deliberately have no service block: Fly's autostop/autostart
# machinery is a proxy feature, and a process group with no service is never
# routed through the proxy — so it can never be autostopped, regardless of
# min_machines_running.
[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines    = "off"
  auto_start_machines   = false
  min_machines_running  = 1
  processes             = ["api"]

  [[http_service.checks]]
    path         = "/health"
    method       = "GET"
    interval     = "15s"
    timeout      = "5s"
    grace_period = "20s"
    # Mandatory, not cosmetic: with force_https enabled, an unheadered
    # internal health check receives a 301 redirect instead of a 200, and Fly
    # marks every new machine unhealthy, failing the deploy.
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

# --- per-process VM sizing --------------------------------------------------
[[vm]]
  processes = ["api"]
  size      = "shared-cpu-1x"
  memory    = "512mb"

[[vm]]
  processes = ["worker"]
  size      = "shared-cpu-1x"
  # app/services/vector_store.py lazily loads the all-MiniLM-L6-v2
  # sentence-transformers model and torch on first embed; a 256mb machine
  # cannot hold it and gets OOM-killed in a restart loop on the first research
  # request. Plan 14-09 must check peak memory after the first real run and go
  # to 2gb if it exceeds 80%.
  memory    = "1gb"

[[vm]]
  processes = ["beat"]
  size      = "shared-cpu-1x"
  memory    = "256mb"

# No mounts table here — the main app is stateless. ChromaDB and Redis are
# separate Fly apps with their own volumes (plan 14-04).
